on: [push, pull_request]
name: Test
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.14.x, 1.15.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ fromJSON(matrix.os == 'windows-latest' && format('["codebuild-stellaraf-actions-public-windows-{0}-{1}","go-{2}"]', github.run_id, github.run_attempt, matrix.go-version) || matrix.os == 'ubuntu-latest' && format('["codebuild-stellaraf-actions-public-{0}-{1}","go-{2}"]', github.run_id, github.run_attempt, matrix.go-version) || format('["{0}"]', matrix.os)) }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test
        run: go test -v
